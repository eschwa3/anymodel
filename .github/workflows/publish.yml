name: Publish to PyPI

# Trusted publishing (OIDC): no API token is stored anywhere. PyPI trusts this repository,
# this workflow file name and the `pypi` environment. Manual for now (name an existing
# release tag); the `push: tags: ["v*"]` trigger is added once the PyPI publisher exists.
# PyPI rejects an already-published version, so a rerun can only complete a failed upload.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to build and publish (e.g. v0.1.12)"
        required: true

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the tag
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version: "3.12"

      - name: Tag must match the package version
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          version="$(uv run --no-project python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          if [ "v${version}" != "${TAG}" ]; then
            echo "tag ${TAG} does not match pyproject version ${version}" >&2
            exit 1
          fi

      - name: Build sdist and wheel
        run: uv build

      - name: Check the distributions
        run: uvx twine check --strict dist/*

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/anymodel-subagents/
    permissions:
      id-token: write # OIDC token for PyPI trusted publishing; nothing else
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
